eligibility_rules:
- id: data_evidence
  priority: 1000
  when:
    any:
    - field: hits.core_data_signals
      op: gte
      value: 2
    - all:
      - field: hits.core_data_signals
        op: gte
        value: 1
      - field: hits.support_signals
        op: gte
        value: 2
  actions:
  - op: set
    field: data_ok
    value: true
  stop: false
- id: backend_evidence
  priority: 990
  when:
    field: hits.backend_data_signals
    op: gte
    value: 2
  actions:
  - op: set
    field: backend_ok
    value: true
  stop: false
- id: bridge_evidence
  priority: 980
  when:
    all:
    - field: hits.bridge_positive_signals
      op: gte
      value: 4
    - field: hits.support_signals
      op: gte
      value: 2
  actions:
  - op: set
    field: bridge_ok
    value: true
  stop: false
- id: transferable_data_identity
  priority: 970
  when:
    all:
    - field: hits.core_data_signals
      op: gte
      value: 3
    - field: hits.support_signals
      op: gte
      value: 2
    - field: hits.analytics_terms
      op: equals
      value: 0
    - field: hits.platform_heavy_terms
      op: lte
      value: 2
  actions:
  - op: set
    field: data_identity
    value: true
  stop: false
- id: target_eligibility
  priority: 900
  when:
    all:
    - field: data_ok
      op: equals
      value: true
    - any:
      - field: hits.strong_target_title_terms
        op: gte
        value: 1
      - all:
        - field: data_identity
          op: equals
          value: true
        - field: hits.non_target_title_terms
          op: equals
          value: 0
        - field: hits.bridge_title_terms
          op: equals
          value: 0
        - field: hits.consultant_title_terms
          op: equals
          value: 0
        - field: hits.data_title_identity
          op: gte
          value: 1
  actions:
  - op: append
    field: eligible
    value: target_lane
  stop: false
- id: secondary_eligibility
  priority: 890
  when:
    all:
    - field: hits.platform_heavy_terms
      op: lte
      value: 3
    - any:
      - field: data_ok
        op: equals
        value: true
      - field: backend_ok
        op: equals
        value: true
  actions:
  - op: append
    field: eligible
    value: secondary_lane
  stop: false
- id: bridge_title_guard
  priority: 880
  when:
    all:
    - field: hits.bridge_title_terms
      op: gte
      value: 1
    - field: data_identity
      op: equals
      value: false
  actions:
  - op: remove
    field: eligible
    value: secondary_lane
  stop: false
- id: bridge_eligibility
  priority: 870
  when:
    all:
    - field: bridge_ok
      op: equals
      value: true
    - field: hits.platform_heavy_terms
      op: lte
      value: 3
    - any:
      - field: hits.bridge_title_terms
        op: gte
        value: 1
      - field: hits.consultant_title_terms
        op: gte
        value: 1
      - field: search_lane
        op: in
        value:
        - bridge
        - contract_bridge
      - all:
        - field: hits.strong_target_title_terms
          op: equals
          value: 0
        - field: hits.secondary_title_terms
          op: equals
          value: 0
  actions:
  - op: append
    field: eligible
    value: bridge_lane
  stop: false
- id: survival_context
  priority: 860
  when:
    all:
    - field: search_lane
      op: in
      value:
      - survival
      - contract_survival
    - field: hits.non_target_title_terms
      op: gte
      value: 1
    - field: data_ok
      op: equals
      value: false
    - field: backend_ok
      op: equals
      value: false
    - field: bridge_ok
      op: equals
      value: false
    - field: hits.platform_heavy_terms
      op: lte
      value: 3
  actions:
  - op: append
    field: eligible
    value: survival_lane
  - op: add_score
    field: points.survival_lane
    value: 20
  stop: false
- id: target_title_weak_data_content
  priority: 800
  when:
